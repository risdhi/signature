<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Signature Verification AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: radial-gradient(ellipse at 60% 20%, #f1f5f9 0%, #cbd5e1 100%);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-icon { font-size: 3rem; }
    .logo h1 {
      font-size: 1.5rem; font-weight: 700; margin-top: 0.5rem;
      background: linear-gradient(90deg, #4f46e5, #0ea5e9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo p { color: #475569; font-size: 0.85rem; margin-top: 0.25rem; }

    .alert {
      padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .alert-error { background: rgba(239,68,68,0.1); color: #dc2626; border: 1px solid rgba(239,68,68,0.2); }
    .alert-success { background: rgba(16,185,129,0.1); color: #059669; border: 1px solid rgba(16,185,129,0.2); }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: #475569; margin-bottom: 0.4rem; }
    input[type=text], input[type=password], input[type=email] {
      width: 100%; padding: 0.75rem 1rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px; color: #0f172a; font-size: 0.95rem;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    input:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); }

    .btn-submit {
      width: 100%; padding: 0.85rem;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: black; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      font-family: 'Inter', sans-serif; margin-top: 0.5rem;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

    .link-row { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #475569; }
    .link-row a { color: #7c3aed; text-decoration: none; font-weight: 600; }
    .link-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">📝</div>
    <h1>Signature AI</h1>
    <p>Sistem Verifikasi Tanda Tangan</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('web.login') }}">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Masukkan username" required autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Masukkan password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-submit">🔐 Masuk</button>
  </form>

  <div class="link-row">
    Belum punya akun? <a href="{{ url_for('web.register') }}">Daftar sekarang</a>
  </div>
</div>
</body>
</html>
