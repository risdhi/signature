<!doctype html>
<html class="dark" lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | SigVerify.AI Forensics</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Geist:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container": "#191f31",
              "on-primary-fixed-variant": "#2f2ebe",
              "on-error-container": "#ffdad6",
              "on-surface-variant": "#c7c4d7",
              primary: "#c0c1ff",
              "on-background": "#dce1fb",
              "on-primary-fixed": "#07006c",
              "secondary-fixed": "#6ffbbe",
              outline: "#908fa0",
              "primary-fixed-dim": "#c0c1ff",
              "surface-container-highest": "#2e3447",
              "on-surface": "#dce1fb",
              "surface-variant": "#2e3447",
              "on-secondary-fixed-variant": "#005236",
              "on-secondary-fixed": "#002113",
              surface: "#0c1324",
              "inverse-primary": "#494bd6",
              "primary-fixed": "#e1e0ff",
              "inverse-surface": "#dce1fb",
              "secondary-container": "#00a572",
              "tertiary-container": "#ff5168",
              "surface-bright": "#33394c",
              "error-container": "#93000a",
              secondary: "#4edea3",
              "on-tertiary-fixed-variant": "#920028",
              error: "#ffb4ab",
              "on-error": "#690005",
              "on-primary-container": "#0d0096",
              "primary-container": "#8083ff",
              "on-primary": "#1000a9",
              "on-tertiary-container": "#5b0015",
              "surface-tint": "#c0c1ff",
              "surface-container-high": "#23293c",
              "tertiary-fixed-dim": "#ffb3b6",
              "tertiary-fixed": "#ffdada",
              background: "#0c1324",
              "on-secondary": "#003824",
              "outline-variant": "#464554",
              "on-tertiary": "#68001a",
              "on-tertiary-fixed": "#40000c",
              "surface-container-low": "#151b2d",
              "surface-container-lowest": "#070d1f",
              "secondary-fixed-dim": "#4edea3",
              "on-secondary-container": "#00311f",
              "inverse-on-surface": "#2a3043",
              "surface-dim": "#0c1324",
            },
            spacing: {
              xs: "8px",
              lg: "40px",
              md: "24px",
              xl: "64px",
              sm: "16px",
              base: "4px",
              gutter: "24px",
            },
            fontFamily: {
              "label-sm": ["JetBrains Mono"],
              "display-lg": ["Geist"],
              "body-md": ["Inter"],
              "headline-md": ["Geist"],
              "headline-lg": ["Geist"],
              "status-caps": ["Geist"],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .glass-panel {
        background: rgba(12, 19, 36, 0.4);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(192, 193, 255, 0.1);
      }
      .active-role {
        background: rgba(192, 193, 255, 0.1);
        border-color: #c0c1ff;
        box-shadow: 0 0 20px rgba(192, 193, 255, 0.2);
      }
      body {
        background-color: #0c1324;
        background-image:
          radial-gradient(
            circle at 20% 20%,
            rgba(192, 193, 255, 0.05) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(78, 222, 163, 0.05) 0%,
            transparent 40%
          );
        color: #dce1fb;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
      }
      .animate-fade-in {
        animation: fadeIn 0.9s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .form-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 1rem 1rem 1rem 3.25rem;
        color: #dce1fb;
        font-size: 1rem;
        transition: all 0.3s ease;
      }
      .form-input::placeholder {
        color: rgba(220, 225, 251, 0.5);
      }
      .form-input:focus {
        outline: none;
        border-color: #c0c1ff;
        box-shadow: 0 0 20px rgba(192, 193, 255, 0.12);
        background: rgba(255, 255, 255, 0.08);
      }
      .input-wrapper {
        position: relative;
      }
      .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.55);
      }
      .btn-primary {
        width: 100%;
        background: #8083ff;
        color: #07006c;
        padding: 1rem 1.25rem;
        border-radius: 1rem;
        font-weight: 700;
        box-shadow: 0 0 25px rgba(128, 131, 255, 0.25);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        opacity: 0.98;
      }
      a {
        color: #c0c1ff;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-center p-sm selection:bg-primary/30"
  >
    <!-- Top Branding -->
    <header class="mb-lg text-center animate-fade-in">
      <h1
        class="font-headline-lg text-headline-lg font-bold text-primary tracking-tighter mb-2"
      >
        SigVerify.AI
      </h1>
    </header>
    <!-- Main Login Card -->
    <main
      class="w-full max-w-md glass-panel rounded-xl p-md shadow-2xl relative overflow-hidden transition-all duration-500"
    >
      <div
        class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 blur-[100px] rounded-full"
      ></div>
      <form
        class="space-y-md"
        method="POST"
        action="{{ url_for('web.login') }}"
      >
        {% if selected_role %}
        <div
          class="rounded-2xl border border-primary/20 bg-white/5 p-4 text-left text-on-surface-variant"
        >
          <p class="font-semibold text-primary">
            Masuk sebagai {{ selected_role|capitalize }}
          </p>
          <p class="text-sm">
            Gunakan akun {{ 'admin' if selected_role == 'admin' else 'pengguna'
            }} untuk melanjutkan.
          </p>
        </div>
        {% endif %}
        <div class="space-y-xs">
          <label
            class="font-label-sm text-label-sm text-on-surface-variant ml-1"
            >Email</label
          >
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon"
              >alternate_email</span
            >
            <input
              class="form-input"
              placeholder="name@organization.ai"
              required
              type="text"
              name="username"
            />
          </div>
        </div>
        <div class="space-y-xs">
          <label
            class="font-label-sm text-label-sm text-on-surface-variant ml-1"
            >Password</label
          >
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input
              class="form-input"
              placeholder="••••••••"
              required
              type="password"
              name="password"
            />
          </div>
        </div>
        <div
          class="flex items-center justify-between pt-xs text-sm text-on-surface-variant"
        >
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              class="rounded border-outline-variant bg-surface-container text-primary focus:ring-primary/20"
              type="checkbox"
              name="remember"
            />
            <span>Ingat Sesi Ini</span>
          </label>
          <a class="text-primary hover:underline decoration-primary/30" href="#"
            >Lupa Kunci?</a
          >
        </div>
        <button
          class="btn-primary font-headline-md text-[18px] py-4 rounded-lg font-bold hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2"
          type="submit"
        >
          Verifikasi Identitas
          <span class="material-symbols-outlined text-[20px]"
            >arrow_forward</span
          >
        </button>
        <div class="text-center mt-md text-on-surface-variant">
          <a href="{{ url_for('web.register') }}" class="text-primary"
            >Belum punya akun? Daftar di sini</a
          >
        </div>
      </form>
    </main>
    <script>
      document
        .querySelectorAll(".material-symbols-outlined")
        .forEach((span) => {
          if (!span.innerText.trim()) {
            const iconName = span.getAttribute("data-icon");
            if (iconName) span.innerText = iconName;
          }
        });
    </script>
  </body>
</html>
