{% extends "base.html" %}

{% block title %}Login - Signature Verification{% endblock %}

{% block content %}
<section class="login-section">
    <h2>Login to Your Account</h2>
    
    <div class="form-container">
        <form method="POST" class="form">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Enter username" class="form-control">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Enter password" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
    </div>

    <div class="register-link" style="text-align: center; margin-top: 1.5rem;">
        <p>Don't have an account? <a href="{{ url_for('web.register') }}" style="color: var(--primary-color); font-weight: 500;">Register here</a></p>
    </div>
</section>

<style>
.login-section {
    max-width: 500px;
    margin: 4rem auto;
    padding: 2rem;
    background: white;
    border-radius: 8px;
    box-shadow: var(--shadow);
}

.login-section h2 {
    text-align: center;
    margin-bottom: 2rem;
    color: var(--dark-color);
}

.form-container {
    margin-bottom: 1.5rem;
}

.form-group {
    margin-bottom: 1.2rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: var(--dark-color);
}

.form-control {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 1rem;
    color: #333;
}

.form-control:focus {
    outline: none;
    border-color: var(--primary-color);
}

.btn-block {
    width: 100%;
    display: block;
}
</style>
{% endblock %}
